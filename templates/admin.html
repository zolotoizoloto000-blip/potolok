<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Центр Потолков · CMS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f4f5f7;font-family:Inter,system-ui}:root{--g:#d9b56d;--line:#ffffff14;--m:#8e98a5}.top{position:sticky;top:0;z-index:20;padding:14px 18px;background:#090c10ec;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand small{display:block;color:var(--m);font-size:8px}.wrap{max-width:1400px;margin:auto;padding:24px 16px 90px}.tabs,.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:11px;padding:10px 12px;font-size:9px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(135deg,#d9b56d,#f4dc9e);color:#171208;border:0}.danger{color:#ef9696}.tab{display:none}.tab.on{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.panel,.card{border:1px solid var(--line);background:linear-gradient(145deg,#11161d,#090c11);border-radius:19px}.stat{padding:17px}.stat strong{font-size:24px;display:block}.stat span{font-size:9px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{overflow:hidden}.cover{height:170px;background:#111820;display:grid;place-items:center;color:#66717d}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.body h3{font-size:13px}.body p{font-size:9px;color:var(--m)}.panel{padding:17px;margin-top:13px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px 6px;border-bottom:1px solid #ffffff0c;font-size:9px;text-align:left}.modal{display:none;position:fixed;inset:0;z-index:80;background:#020406df;overflow:auto;padding:16px}.modal.on{display:flex;justify-content:center;align-items:flex-start}.box{width:min(950px,100%);background:#0d1218;border:1px solid var(--line);border-radius:23px}.boxhead,.boxfoot{padding:16px 18px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.boxfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.boxbody{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.field label{font-size:8px;color:var(--m)}input,select,textarea{width:100%;border:1px solid var(--line);background:#080b10;color:#fff;border-radius:10px;padding:10px;font:inherit;font-size:9px}textarea{min-height:90px}.langblock{padding:12px;border:1px solid var(--line);border-radius:14px}.langblock b{font-size:10px;color:#f0d58f}.photos{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.photos .ph{position:relative}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.photos .ph button{position:absolute;right:4px;top:4px;width:25px;height:25px;border:0;border-radius:8px;background:#07090dcc;color:white;cursor:pointer}.toast{position:fixed;right:16px;bottom:16px;padding:11px 14px;background:#152019;border:1px solid #65d39144;border-radius:11px;font-size:9px;opacity:0}.toast.on{opacity:1}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.photos{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start}.stats{gap:7px}}</style></head><body>
<header class=top><div class=brand>Центр Потолков<small>PRODUCTION CMS</small></div><div class=row><a class=btn href=/ru/ target=_blank>Сайт ↗</a><form action=/admin/logout method=post><input type=hidden name=csrf value="{{csrf_token}}"><button class=btn>Выйти</button></form></div></header>
<main class=wrap><div class=tabs><button class="btn gold" onclick="showTab('products',this)">Товары</button><button class=btn onclick="showTab('leads',this)">CRM / заявки</button><button class=btn onclick="showTab('categories',this)">Категории</button><button class=btn onclick="showTab('audit',this)">Журнал</button></div>
<section class="tab on" id=products><div class=stats><div class=stat><strong id=count>0</strong><span>Товаров</span></div><div class=stat><strong id=published>0</strong><span>Опубликовано</span></div><div class=stat><strong id=news>0</strong><span>Новинок</span></div><div class=stat><strong id=featured>0</strong><span>Рекомендуемых</span></div></div><div class=row style="margin-bottom:12px"><input id=search placeholder="Поиск товара…" style="max-width:300px"><button class="btn gold" onclick="openForm()">＋ Добавить товар</button></div><div class=grid id=grid></div></section>
<section class=tab id=leads><div class=panel><h3>Заявки</h3><div style="overflow:auto"><table class=table><thead><tr><th>Дата</th><th>Источник</th><th>Клиент</th><th>Телефон</th><th>Сообщение</th><th>Заметка</th><th>След. контакт</th><th>Статус</th></tr></thead><tbody id=leadRows></tbody></table></div></div></section>
<section class=tab id=categories><div class=panel><h3>Категории</h3><div class=form><div class=field><label>RU</label><input id=cat_ru></div><div class=field><label>KZ</label><input id=cat_kz></div><div class=field><label>EN</label><input id=cat_en></div><div class=field style="align-self:end"><button class="btn gold" onclick=addCat()>Добавить</button></div></div><div id=catList style="margin-top:14px"></div></div></section><section class=tab id=audit><div class=panel><h3>Журнал действий</h3><div style="overflow:auto"><table class=table><thead><tr><th>Дата</th><th>Действие</th><th>Объект</th><th>Детали</th></tr></thead><tbody id=auditRows></tbody></table></div></div></section></main>
<div class=modal id=modal><div class=box><div class=boxhead><b id=formTitle>Новый товар</b><button class=btn onclick=closeForm()>✕</button></div><form id=form><div class=boxbody><div class=form>
<div class="field full"><label>Фотографии — до 8, автоматически сжимаются в WebP</label><input id=photos type=file multiple accept="image/jpeg,image/png,image/webp"><div class=photos id=previews></div></div>
<div class="langblock full"><b>RU</b><div class=form><div class="field full"><label>Название *</label><input id=name_ru required></div><div class="field full"><label>Описание</label><textarea id=description_ru></textarea></div><div class="field full"><label>Характеристики</label><textarea id=specs_ru></textarea></div></div></div>
<div class="langblock full"><b>KZ</b><div class=form><div class="field full"><label>Атауы</label><input id=name_kz></div><div class="field full"><label>Сипаттама</label><textarea id=description_kz></textarea></div><div class="field full"><label>Сипаттамалары</label><textarea id=specs_kz></textarea></div></div></div>
<div class="langblock full"><b>EN</b><div class=form><div class="field full"><label>Name</label><input id=name_en></div><div class="field full"><label>Description</label><textarea id=description_en></textarea></div><div class="field full"><label>Specifications</label><textarea id=specs_en></textarea></div></div></div>
<div class=field><label>Категория</label><select id=category><option value="">Загрузка категорий…</option></select></div><div class=field><label>Бренд</label><input id=brand></div>
<div class=field><label>Цена ₸</label><input id=price type=number min=0></div><div class=field><label>Единица</label><select id=unit><option>₸ / шт.</option><option>₸ / м</option><option>₸ / м²</option><option>₸ / комплект</option></select></div>
<div class=field><label>Старая цена</label><input id=old_price type=number min=0></div><div class=field><label>Наличие</label><select id=stock><option>В наличии</option><option>Под заказ</option><option>Нет в наличии</option></select></div>
<div class=field><label>Артикул</label><input id=sku></div><div class=field><label>Статус</label><select id=status><option>Опубликован</option><option>Черновик</option><option>Скрыт</option></select></div>
<div class=field><label><input id=ask_price type=checkbox> Цена по запросу</label></div><div class=field><label><input id=featured type=checkbox> Рекомендуемый</label></div><div class=field><label><input id=new_item type=checkbox> Новинка</label></div>
</div></div><div class=boxfoot><button type=button class=btn onclick=closeForm()>Отмена</button><button class="btn gold" type=submit>Сохранить</button></div></form></div></div><div class=toast id=toast></div>
<script>
const CSRF={{csrf_token|tojson}};let items=[],editing=null,keptPhotos=[],newFiles=[],categories=[];const $=x=>document.getElementById(x);function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1600)}
function showTab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('gold'));b.classList.add('gold');if(id==='leads')loadLeads();if(id==='audit')loadAudit();if(id==='categories')loadCats()}
async function load(){items=await(await fetch('/api/products?all=1')).json();await refreshCategories();render()}
async function refreshCategories(){categories=await(await fetch('/api/categories')).json();let sel=$('category'),cur=sel.value;sel.innerHTML='<option value="">Без категории</option>'+categories.map(c=>`<option value="${c.title_ru}">${c.title_ru}</option>`).join('');if(cur)sel.value=cur}
function render(){let q=$('search').value.toLowerCase();let a=items.filter(x=>x.name_ru.toLowerCase().includes(q));$('count').textContent=items.length;$('published').textContent=items.filter(x=>x.status==='Опубликован').length;$('news').textContent=items.filter(x=>x.new_item).length;$('featured').textContent=items.filter(x=>x.featured).length;$('grid').innerHTML=a.map(x=>`<article class=card><div class=cover>${x.photos?.[0]?`<img src="${x.photos[0]}">`:'Нет фото'}</div><div class=body><p>${x.brand||''} · ${x.category||''}</p><h3>${x.name_ru}</h3><p>${x.status} · ${x.stock}</p><div class=row><button class=btn onclick="moveProduct(${x.id},-1)">↑</button><button class=btn onclick="moveProduct(${x.id},1)">↓</button><button class=btn onclick="edit(${x.id})">✎ Изменить</button><button class=btn onclick="toggle(${x.id})">${x.status==='Опубликован'?'Скрыть':'Опубликовать'}</button><button class="btn danger" onclick="del(${x.id})">Удалить</button></div></div></article>`).join('')+renderNewPhotos()}
$('search').oninput=render;
function openForm(x=null){editing=x?.id||null;$('formTitle').textContent=x?'Изменить товар':'Новый товар';['name_ru','name_kz','name_en','description_ru','description_kz','description_en','specs_ru','specs_kz','specs_en','brand','price','old_price','sku'].forEach(k=>$(k).value=x?.[k]??'');['category','unit','stock','status'].forEach(k=>{if(x?.[k])$(k).value=x[k]});['ask_price','featured','new_item'].forEach(k=>$(k).checked=!!x?.[k]);keptPhotos=[...(x?.photos||[])];renderPhotos();$('modal').classList.add('on')}
function renderPhotos(){$('previews').innerHTML=keptPhotos.map((u,i)=>`<div class="ph"><img src="${u}"><button type="button" onclick="removePhoto(${i})">×</button><div style="position:absolute;left:4px;bottom:5px;display:flex;gap:3px"><button type="button" style="position:static" onclick="movePhoto(${i},-1)">‹</button><button type="button" style="position:static" onclick="movePhoto(${i},1)">›</button></div></div>`).join('')}
function removePhoto(i){keptPhotos.splice(i,1);renderPhotos()}
function renderNewPhotos(){return newFiles.map((f,i)=>`<div class="ph"><img src="${URL.createObjectURL(f)}"><small style="position:absolute;left:5px;bottom:5px;background:#111c;padding:3px">Новое</small><button type="button" onclick="newFiles.splice(${i},1);renderPhotos()">×</button></div>`).join('')}
function movePhoto(i,d){let j=i+d;if(j<0||j>=keptPhotos.length)return;[keptPhotos[i],keptPhotos[j]]=[keptPhotos[j],keptPhotos[i]];renderPhotos()}
function closeForm(){$('modal').classList.remove('on');$('form').reset();editing=null;keptPhotos=[];newFiles=[]}
$('photos').onchange=e=>{newFiles=[...e.target.files].slice(0,Math.max(0,8-keptPhotos.length));renderPhotos()};
$('form').onsubmit=async e=>{e.preventDefault();let fd=new FormData();['name_ru','name_kz','name_en','description_ru','description_kz','description_en','specs_ru','specs_kz','specs_en','category','brand','price','unit','old_price','stock','sku','status'].forEach(k=>fd.append(k,$(k).value));['ask_price','featured','new_item'].forEach(k=>fd.append(k,$(k).checked?'1':'0'));newFiles.forEach(f=>fd.append('photos',f));fd.append('keep_photos',JSON.stringify(keptPhotos));let r=await fetch(editing?'/api/products/'+editing:'/api/products',{method:editing?'PUT':'POST',headers:{'X-CSRF-Token':CSRF},body:fd});if(!r.ok){toast((await r.json()).error||'Ошибка');return}closeForm();await load();toast('Сохранено')}
function edit(id){openForm(items.find(x=>x.id===id))}
async function toggle(id){let x=items.find(v=>v.id===id),fd=new FormData();['name_ru','name_kz','name_en','description_ru','description_kz','description_en','specs_ru','specs_kz','specs_en','category','brand','price','unit','old_price','stock','sku'].forEach(k=>fd.append(k,x[k]??''));fd.append('status',x.status==='Опубликован'?'Скрыт':'Опубликован');['ask_price','featured','new_item'].forEach(k=>fd.append(k,x[k]?'1':'0'));await fetch('/api/products/'+id,{method:'PUT',headers:{'X-CSRF-Token':CSRF},body:fd});load()}
async function del(id){let x=items.find(v=>v.id===id);if(!confirm('Удалить «'+x.name_ru+'»?'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:{'X-CSRF-Token':CSRF}});load();toast('Удалено')}
async function moveProduct(id,d){let i=items.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];await fetch('/api/products/reorder',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify({ids:items.map(x=>x.id)})});render();toast('Порядок сохранён')}
async function loadCats(){let a=await(await fetch('/api/categories')).json();$('catList').innerHTML=a.map(x=>`<div class="row" style="padding:9px;border-bottom:1px solid #ffffff0d;justify-content:space-between"><span>${x.title_ru} / ${x.title_kz||'—'} / ${x.title_en||'—'}</span><button class="btn danger" onclick="delCat(${x.id})">Удалить</button></div>`).join('')}
async function addCat(){let fd=new FormData();fd.append('title_ru',$('cat_ru').value);fd.append('title_kz',$('cat_kz').value);fd.append('title_en',$('cat_en').value);let r=await fetch('/api/categories',{method:'POST',headers:{'X-CSRF-Token':CSRF},body:fd});if(r.ok){['cat_ru','cat_kz','cat_en'].forEach(x=>$(x).value='');loadCats();toast('Категория добавлена')}else toast((await r.json()).error)}
async function delCat(id){if(!confirm('Удалить категорию?'))return;await fetch('/api/categories/'+id,{method:'DELETE',headers:{'X-CSRF-Token':CSRF}});loadCats()}
async function loadLeads(){let a=await(await fetch('/api/leads')).json();$('leadRows').innerHTML=a.map(x=>`<tr><td>${x.created_at}</td><td>${x.source}</td><td>${x.name||'—'}</td><td>${x.phone||'—'}</td><td>${x.message||'—'}</td><td><input id="note${x.id}" value="${x.manager_note||''}" placeholder="Заметка"></td><td><input id="next${x.id}" type="datetime-local" value="${x.next_contact||''}"></td><td><select onchange="leadStatus(${x.id},this.value)"><option>${x.status}</option>${['Новая','В работе','Продажа','Отказ'].filter(s=>s!==x.status).map(s=>`<option>${s}</option>`).join('')}</select></td></tr>`).join('')}
async function leadStatus(id,status){let fd=new FormData();fd.append('status',status);fd.append('manager_note',$('note'+id)?.value||'');fd.append('next_contact',$('next'+id)?.value||'');await fetch('/api/leads/'+id,{method:'PUT',headers:{'X-CSRF-Token':CSRF},body:fd});toast('Заявка сохранена')}
async function loadAudit(){let a=await(await fetch('/api/audit')).json();$('auditRows').innerHTML=a.map(x=>`<tr><td>${x.created_at}</td><td>${x.action}</td><td>${x.entity} #${x.entity_id||''}</td><td>${x.detail||''}</td></tr>`).join('')}
load();
</script></body></html>
