<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:white;font-family:Inter,system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(380px,90vw);padding:28px;border:1px solid #ffffff18;border-radius:24px;background:linear-gradient(145deg,#11161d,#090c11);box-shadow:0 30px 100px #000}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#d9b56d,#f4dc9e);color:#171208;font-weight:950}p{color:#89929e;font-size:11px}input,button{width:100%;padding:13px;border-radius:12px;font:inherit}input{border:1px solid #ffffff18;background:#080b10;color:#fff}button{margin-top:10px;border:0;background:#d9b56d;font-weight:950}.err{color:#ef8f8f;font-size:10px}</style><form class=box method=post><div class=logo>CP</div><h2>Центр Потолков</h2><p>Защищённый вход в CMS</p>{% if error %}<div class=err>{{error}}</div>{% endif %}<input name=password type=password required autocomplete=current-password placeholder="Пароль"><button>Войти</button></form>
